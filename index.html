<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>受保护工作册</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#283b2c;font-family:system-ui,'Microsoft YaHei',sans-serif}.gate{min-height:100vh;display:grid;place-items:center;padding:25px}form{width:100%;max-width:390px;background:#fffef9;border:1px solid #d4dccd;padding:32px;border-radius:12px}h1{font-size:25px;font-weight:500}p{font-size:14px;line-height:1.8;color:#6a775e}label{font-size:13px}input,button{font:inherit;width:100%;padding:12px;border-radius:5px;margin-top:10px}input{border:1px solid #cdd5c5}button{background:#3f543c;color:#fff;border:0;cursor:pointer}#status{min-height:25px;color:#963e35;font-size:13px;margin-top:12px}iframe{display:block;width:100%;height:100vh;border:0}#lock{position:fixed;right:20px;bottom:74px;width:auto;z-index:100;padding:8px 13px;font-size:12px}[hidden]{display:none!important}</style></head><body><main class="gate" id="gate"><form id="login"><h1>受保护工作册</h1><p>请输入访问密码，解锁剧本和资产图片。</p><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">解锁查看</button><div id="status" role="status" aria-live="polite"></div></form></main><iframe id="workbook" title="剧本工作册" hidden></iframe><button id="lock" hidden>锁定</button><script>
let key=null,files={},cache=new Map();
async function decryptFile(name){const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw Error('load');const bytes=new Uint8Array(await r.arrayBuffer());return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));}
window.hasProtectedFile=name=>Object.prototype.hasOwnProperty.call(files,name);
window.getProtectedFile=name=>{if(!cache.has(name)){const entry=files[name];if(!entry)return Promise.reject(Error('missing'));cache.set(name,decryptFile(entry.file).then(bytes=>URL.createObjectURL(new Blob([bytes],{type:entry.type}))).catch(e=>{cache.delete(name);throw e}));}return cache.get(name)};
document.getElementById('login').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status'),input=document.getElementById('password');button.disabled=true;status.textContent='正在解锁…';try{const r=await fetch('config.json',{cache:'no-store'});if(!r.ok)throw Error('load');const config=await r.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(config.salt),c=>c.charCodeAt(0)),iterations:config.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);const bundle=JSON.parse(new TextDecoder().decode(await decryptFile('content.bin')));files=bundle.files;input.value='';const frame=document.getElementById('workbook');frame.srcdoc=bundle.html;frame.hidden=false;document.getElementById('gate').hidden=true;document.getElementById('lock').hidden=false;status.textContent='';}catch(e){key=null;status.textContent=e.name==='OperationError'?'密码不正确，请重试。':'加载失败，请检查网络后重试。'}finally{button.disabled=false}};
document.getElementById('lock').onclick=()=>location.reload();
</script></body></html>
